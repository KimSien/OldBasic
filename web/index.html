<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>BASIC Interpreter</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: #1a1a2e; color: #eee; font-family: monospace; display: flex; flex-direction: column; height: 100vh; }
    header { padding: 10px 16px; background: #16213e; display: flex; align-items: center; gap: 12px; border-bottom: 1px solid #0f3460; }
    header h1 { font-size: 1.1rem; color: #e94560; }
    button { padding: 6px 16px; border: none; border-radius: 4px; cursor: pointer; font-family: monospace; font-size: 0.9rem; }
    #btn-run  { background: #0f3460; color: #fff; }
    #btn-run:hover  { background: #e94560; }
    #btn-clear { background: #333; color: #ccc; }
    #status { font-size: 0.8rem; color: #aaa; margin-left: auto; }
    #key-debug { font-size: 0.8rem; color: #7dd3fc; min-width: 140px; text-align: right; }
    select { background: #0d0d1a; color: #a8ff78; border: 1px solid #0f3460; border-radius: 4px; padding: 4px 8px; font-family: monospace; font-size: 0.85rem; cursor: pointer; }
    main { display: flex; flex: 1; overflow: hidden; }
    #editor-panel { display: flex; flex-direction: column; width: 380px; min-width: 200px; border-right: 1px solid #0f3460; }
    #code { flex: 1; background: #0d0d1a; color: #a8ff78; border: none; padding: 12px; font-family: monospace; font-size: 0.85rem; resize: none; outline: none; }
    #right-panel { flex: 1; display: flex; flex-direction: column; overflow: hidden; }
    #canvas-wrap { flex: 1; display: flex; align-items: center; justify-content: center; background: #000; overflow: hidden; outline: none; }
    canvas { image-rendering: pixelated; border: 1px solid #333; }
    #console { height: 120px; background: #0d0d1a; border-top: 1px solid #0f3460; overflow-y: auto; padding: 8px 12px; font-size: 0.8rem; color: #ccc; white-space: pre-wrap; }
  </style>
</head>
<body>
<header>
  <h1>BASIC Interpreter</h1>
  <select id="sample-select">
    <option value="">-- サンプル --</option>
    <option value="colors">colors.bas — 16色パレット</option>
    <option value="shapes">shapes.bas — 図形描画</option>
    <option value="gradient">gradient.bas — グラデーション＋サイン波</option>
    <option value="bounce">bounce.bas — バウンドボール</option>
    <option value="sprite">sprite.bas — スプライト移動</option>
    <option value="keytest">keytest.bas — キー入力テスト</option>
    <option value="invader">invader.bas — スペースインベーダー</option>
  </select>
  <button id="btn-run">&#9654; RUN</button>
  <button id="btn-clear">CLR</button>
  <span id="key-debug">key: idle</span>
  <span id="status">Pyodide を読み込み中...</span>
</header>
<main>
  <div id="editor-panel">
    <textarea id="code" spellcheck="false">10 SCREEN 1
20 CLS
30 COLOR 14, 1
40 FOR Y = 0 TO 199 STEP 4
50   FOR X = 0 TO 319 STEP 4
60     PSET (X, Y), (X + Y) MOD 16
70   NEXT X
80 NEXT Y
90 CIRCLE (160, 100), 60, 15
100 LINE (0,0)-(319,199), 10, B
110 PRINT "Hello, BASIC!"
</textarea>
  </div>
  <div id="right-panel">
    <div id="canvas-wrap" tabindex="0">
      <canvas id="canvas" width="320" height="200"></canvas>
    </div>
    <div id="console"></div>
  </div>
</main>

<script src="https://cdn.jsdelivr.net/pyodide/v0.26.4/full/pyodide.js"></script>
<script>
// Key buffer for INKEY$.
// Keep this in JS so Python only reads state and never needs re-entrant callbacks.
window.basicKeyBuf = '';
window.basicKeyQueue = [];
const _KEY_MAP = {
  'ArrowLeft': 'z', 'ArrowRight': 'x',
  ' ': ' ', 'z': 'z', 'x': 'x', 'Z': 'z', 'X': 'x'
};
const keyDebugEl = document.getElementById('key-debug');
function updateKeyDebug(label) {
  keyDebugEl.textContent = `key: ${label}`;
}
window.addEventListener('keydown', e => {
  const k = _KEY_MAP[e.key] !== undefined ? _KEY_MAP[e.key]
            : (e.key.length === 1 ? e.key : null);
  if (k !== null) {
    window.basicKeyBuf = k;
    window.basicKeyQueue.push(k);
    updateKeyDebug(k === ' ' ? 'SPACE' : k);
    e.preventDefault();
  }
});
window.addEventListener('keyup', e => {
  const k = _KEY_MAP[e.key] !== undefined ? _KEY_MAP[e.key]
            : (e.key.length === 1 ? e.key : null);
  if (k === null || window.basicKeyBuf === k) {
    window.basicKeyBuf = '';
    updateKeyDebug('idle');
  }
});
window.addEventListener('blur', () => {
  window.basicKeyBuf = '';
  window.basicKeyQueue = [];
  updateKeyDebug('idle');
});

// B-1: Batch drawing — execute queued canvas commands in a single JS call.
// E-3: Track current fill/stroke style to skip redundant property sets.
window.basicBatchDraw = function(cmds) {
  const ctx = document.getElementById('canvas').getContext('2d');
  let curFill = null, curStroke = null;
  for (const c of cmds) {
    switch (c[0]) {
      case 'cls':
        if (c[1] !== curFill) { ctx.fillStyle = c[1]; curFill = c[1]; }
        ctx.fillRect(0, 0, c[2], c[3]);
        break;
      case 'pset':
        if (c[1] !== curFill) { ctx.fillStyle = c[1]; curFill = c[1]; }
        ctx.fillRect(c[2], c[3], 1, 1);
        break;
      case 'line':
        if (c[1] !== curStroke) { ctx.strokeStyle = c[1]; curStroke = c[1]; }
        ctx.beginPath();
        ctx.moveTo(c[2] + 0.5, c[3] + 0.5);
        ctx.lineTo(c[4] + 0.5, c[5] + 0.5);
        ctx.stroke();
        break;
      case 'rect':
        if (c[1] !== curStroke) { ctx.strokeStyle = c[1]; curStroke = c[1]; }
        ctx.strokeRect(c[2], c[3], c[4], c[5]);
        break;
      case 'fillrect':
        if (c[1] !== curFill) { ctx.fillStyle = c[1]; curFill = c[1]; }
        ctx.fillRect(c[2], c[3], c[4], c[5]);
        break;
      case 'circle':
        if (c[1] !== curStroke) { ctx.strokeStyle = c[1]; curStroke = c[1]; }
        ctx.beginPath();
        ctx.arc(c[2], c[3], c[4], c[5], c[6]);
        ctx.stroke();
        break;
      case 'circle_scaled':
        if (c[1] !== curStroke) { ctx.strokeStyle = c[1]; curStroke = c[1]; }
        ctx.save();
        ctx.translate(c[2], c[3]);
        ctx.scale(1.0, c[7]);
        ctx.beginPath();
        ctx.arc(0, 0, c[4], c[5], c[6]);
        ctx.stroke();
        ctx.restore();
        break;
    }
  }
};

// C-1/C-2: JS-side flood fill with scanline BFS — avoids Python↔JS buffer transfer.
window.basicFloodFill = function(cx, cy, fillR, fillG, fillB, borderR, borderG, borderB, useBorder) {
  const canvas = document.getElementById('canvas');
  const ctx = canvas.getContext('2d');
  const w = canvas.width, h = canvas.height;
  if (cx < 0 || cx >= w || cy < 0 || cy >= h) return;

  const img = ctx.getImageData(0, 0, w, h);
  const d = img.data;
  const i0 = (cy * w + cx) * 4;
  const seedR = d[i0], seedG = d[i0 + 1], seedB = d[i0 + 2];

  if (seedR === fillR && seedG === fillG && seedB === fillB) return;

  const visited = new Uint8Array(w * h);
  const stack = [cx + cy * w];

  while (stack.length > 0) {
    const p = stack.pop();
    if (visited[p]) continue;
    const py = (p / w) | 0;
    const px = p % w;
    const i4 = p * 4;

    if (useBorder) {
      if (d[i4] === borderR && d[i4 + 1] === borderG && d[i4 + 2] === borderB) continue;
    } else {
      if (d[i4] !== seedR || d[i4 + 1] !== seedG || d[i4 + 2] !== seedB) continue;
    }

    visited[p] = 1;
    d[i4] = fillR; d[i4 + 1] = fillG; d[i4 + 2] = fillB; d[i4 + 3] = 255;

    if (px > 0)     stack.push(p - 1);
    if (px < w - 1) stack.push(p + 1);
    if (py > 0)     stack.push(p - w);
    if (py < h - 1) stack.push(p + w);
  }

  ctx.putImageData(img, 0, 0);
};

let pyodide = null;
const statusEl  = document.getElementById('status');
const consoleEl = document.getElementById('console');
const btnRun    = document.getElementById('btn-run');
const btnClear  = document.getElementById('btn-clear');
const canvasWrap = document.getElementById('canvas-wrap');

function log(msg, color = '#ccc') {
  const span = document.createElement('span');
  span.style.color = color;
  span.textContent = msg + '\n';
  consoleEl.appendChild(span);
  consoleEl.scrollTop = consoleEl.scrollHeight;
}

async function init() {
  try {
    log('Pyodide を初期化中...', '#aaa');
    pyodide = await loadPyodide();

    // Create package directory structure in Pyodide's VFS
    pyodide.FS.mkdir('/home/pyodide/basic');
    pyodide.FS.mkdir('/home/pyodide/web');

    // Load Python source files from the server
    const coreFiles = [
      ['basic/__init__.py', '/home/pyodide/basic/__init__.py'],
      ['basic/lexer.py',    '/home/pyodide/basic/lexer.py'],
      ['basic/parser.py',   '/home/pyodide/basic/parser.py'],
      ['basic/renderer.py', '/home/pyodide/basic/renderer.py'],
      ['basic/interpreter.py', '/home/pyodide/basic/interpreter.py'],
      ['web/canvas_renderer.py', '/home/pyodide/web/canvas_renderer.py'],
    ];

    for (const [src, dst] of coreFiles) {
      const resp = await fetch('../' + src, { cache: 'no-store' });
      if (!resp.ok) throw new Error(`Failed to fetch ${src}: ${resp.status}`);
      const text = await resp.text();
      pyodide.FS.writeFile(dst, text, { encoding: 'utf8' });
      log(`  読み込み: ${src}`, '#555');
    }

    // Bootstrap interpreter in Python
    await pyodide.runPythonAsync(`
import sys, asyncio
sys.path.insert(0, '/home/pyodide')
sys.path.insert(0, '/home/pyodide/web')
from basic.interpreter import Interpreter, BasicError
from canvas_renderer import CanvasRenderer

# Live stdout — writes directly to the console div without buffering
class _LiveOut:
    def __init__(self):
        import js as _js
        self._el = _js.document.getElementById('console')  # E-2: cache DOM ref
    def write(self, text):
        if self._el and text:
            self._el.textContent += text
    def flush(self): pass
sys.stdout = _LiveOut()
print("BASIC interpreter ready")
`);

    statusEl.textContent = '準備完了';
    btnRun.disabled = false;
    log('準備完了。RUN ボタンを押してプログラムを実行できます。', '#a8ff78');
  } catch (e) {
    statusEl.textContent = 'エラー';
    log('初期化エラー: ' + e.message, '#e94560');
    console.error(e);
  }
}

btnRun.disabled = true;
btnRun.addEventListener('click', async () => {
  if (!pyodide) return;
  consoleEl.textContent = '';
  window.basicKeyBuf = '';
  window.basicKeyQueue = [];
  updateKeyDebug('ready');
  canvasWrap.focus();
  const code = document.getElementById('code').value;
  statusEl.textContent = '実行中...';
  btnRun.disabled = true;
  try {
    pyodide.globals.set('_basic_source', code);
    await pyodide.runPythonAsync(`
try:
    renderer = CanvasRenderer('canvas')
    interp = Interpreter(renderer=renderer)
    interp.load(_basic_source)
    await interp.run_async()
except BasicError as e:
    print(f"BASIC エラー: {e}")
except Exception as e:
    import traceback
    print(traceback.format_exc())
`);
    statusEl.textContent = '完了';
  } catch (e) {
    log('実行エラー: ' + e.message, '#e94560');
    statusEl.textContent = 'エラー';
  }
  btnRun.disabled = false;
});

btnClear.addEventListener('click', () => {
  consoleEl.textContent = '';
});

document.getElementById('sample-select').addEventListener('change', async (e) => {
  const name = e.target.value;
  if (!name) return;
  try {
    const resp = await fetch('../examples/' + name + '.bas', { cache: 'no-store' });
    if (!resp.ok) throw new Error(`HTTP ${resp.status}`);
    document.getElementById('code').value = await resp.text();
    e.target.value = '';
  } catch (err) {
    log('サンプル読み込みエラー: ' + err.message, '#e94560');
  }
});

init();
</script>
</body>
</html>
