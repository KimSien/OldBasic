<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>BASIC Interpreter</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: #1a1a2e; color: #eee; font-family: monospace; display: flex; flex-direction: column; height: 100vh; }
    header { padding: 10px 16px; background: #16213e; display: flex; align-items: center; gap: 12px; border-bottom: 1px solid #0f3460; }
    header h1 { font-size: 1.1rem; color: #e94560; }
    button { padding: 6px 16px; border: none; border-radius: 4px; cursor: pointer; font-family: monospace; font-size: 0.9rem; }
    #btn-run  { background: #0f3460; color: #fff; }
    #btn-run:hover  { background: #e94560; }
    #btn-clear { background: #333; color: #ccc; }
    #status { font-size: 0.8rem; color: #aaa; margin-left: auto; }
    main { display: flex; flex: 1; overflow: hidden; }
    #editor-panel { display: flex; flex-direction: column; width: 380px; min-width: 200px; border-right: 1px solid #0f3460; }
    #code { flex: 1; background: #0d0d1a; color: #a8ff78; border: none; padding: 12px; font-family: monospace; font-size: 0.85rem; resize: none; outline: none; }
    #right-panel { flex: 1; display: flex; flex-direction: column; overflow: hidden; }
    #canvas-wrap { flex: 1; display: flex; align-items: center; justify-content: center; background: #000; overflow: hidden; }
    canvas { image-rendering: pixelated; border: 1px solid #333; }
    #console { height: 120px; background: #0d0d1a; border-top: 1px solid #0f3460; overflow-y: auto; padding: 8px 12px; font-size: 0.8rem; color: #ccc; white-space: pre-wrap; }
  </style>
</head>
<body>
<header>
  <h1>BASIC Interpreter</h1>
  <button id="btn-run">&#9654; RUN</button>
  <button id="btn-clear">CLR</button>
  <span id="status">Pyodide を読み込み中...</span>
</header>
<main>
  <div id="editor-panel">
    <textarea id="code" spellcheck="false">10 SCREEN 1
20 CLS
30 COLOR 14, 1
40 FOR Y = 0 TO 199 STEP 4
50   FOR X = 0 TO 319 STEP 4
60     PSET (X, Y), (X + Y) MOD 16
70   NEXT X
80 NEXT Y
90 CIRCLE (160, 100), 60, 15
100 LINE (0,0)-(319,199), 10, B
110 PRINT "Hello, BASIC!"
</textarea>
  </div>
  <div id="right-panel">
    <div id="canvas-wrap">
      <canvas id="canvas" width="320" height="200"></canvas>
    </div>
    <div id="console" id="output"></div>
  </div>
</main>

<script src="https://cdn.jsdelivr.net/pyodide/v0.26.4/full/pyodide.js"></script>
<script>
let pyodide = null;
const statusEl  = document.getElementById('status');
const consoleEl = document.getElementById('console');
const btnRun    = document.getElementById('btn-run');
const btnClear  = document.getElementById('btn-clear');

function log(msg, color = '#ccc') {
  const span = document.createElement('span');
  span.style.color = color;
  span.textContent = msg + '\n';
  consoleEl.appendChild(span);
  consoleEl.scrollTop = consoleEl.scrollHeight;
}

async function init() {
  try {
    log('Pyodide を初期化中...', '#aaa');
    pyodide = await loadPyodide();

    // Create package directory structure in Pyodide's VFS
    pyodide.FS.mkdir('/home/pyodide/basic');
    pyodide.FS.mkdir('/home/pyodide/web');

    // Load Python source files from the server
    const coreFiles = [
      ['basic/__init__.py', '/home/pyodide/basic/__init__.py'],
      ['basic/lexer.py',    '/home/pyodide/basic/lexer.py'],
      ['basic/parser.py',   '/home/pyodide/basic/parser.py'],
      ['basic/renderer.py', '/home/pyodide/basic/renderer.py'],
      ['basic/interpreter.py', '/home/pyodide/basic/interpreter.py'],
      ['web/canvas_renderer.py', '/home/pyodide/web/canvas_renderer.py'],
    ];

    for (const [src, dst] of coreFiles) {
      const resp = await fetch('../' + src);
      if (!resp.ok) throw new Error(`Failed to fetch ${src}: ${resp.status}`);
      const text = await resp.text();
      pyodide.FS.writeFile(dst, text, { encoding: 'utf8' });
      log(`  読み込み: ${src}`, '#555');
    }

    // Bootstrap interpreter in Python
    await pyodide.runPythonAsync(`
import sys
sys.path.insert(0, '/home/pyodide')
sys.path.insert(0, '/home/pyodide/web')
from basic.interpreter import Interpreter, BasicError
from canvas_renderer import CanvasRenderer
print("BASIC interpreter ready")
`);

    statusEl.textContent = '準備完了';
    btnRun.disabled = false;
    log('準備完了。RUN ボタンを押してプログラムを実行できます。', '#a8ff78');
  } catch (e) {
    statusEl.textContent = 'エラー';
    log('初期化エラー: ' + e.message, '#e94560');
    console.error(e);
  }
}

btnRun.disabled = true;
btnRun.addEventListener('click', async () => {
  if (!pyodide) return;
  consoleEl.textContent = '';
  const code = document.getElementById('code').value;
  statusEl.textContent = '実行中...';
  btnRun.disabled = true;
  try {
    // Redirect stdout to the console div
    pyodide.globals.set('_basic_source', code);
    await pyodide.runPythonAsync(`
import sys
from io import StringIO

_out_buf = StringIO()
_old_stdout = sys.stdout
sys.stdout = _out_buf

try:
    renderer = CanvasRenderer('canvas', 'console-output')
    interp = Interpreter(renderer=renderer)
    interp.load(_basic_source)
    interp.run()
except BasicError as e:
    print(f"BASIC エラー: {e}")
except Exception as e:
    print(f"エラー: {e}")
finally:
    sys.stdout = _old_stdout

_output = _out_buf.getvalue()
`);
    const output = pyodide.globals.get('_output');
    if (output) log(output);
    statusEl.textContent = '完了';
  } catch (e) {
    log('実行エラー: ' + e.message, '#e94560');
    statusEl.textContent = 'エラー';
  }
  btnRun.disabled = false;
});

btnClear.addEventListener('click', () => {
  consoleEl.textContent = '';
});

init();
</script>
</body>
</html>
